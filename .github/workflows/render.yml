name: Render explainer video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  render:
    name: Kokoro TTS + Remotion render
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Make sure ffmpeg and espeak-ng are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          if ! command -v espeak-ng >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y espeak-ng
          fi
          ffmpeg -version | head -1

      - name: Install Kokoro (onnxruntime, CPU only)
        run: pip install --no-cache-dir kokoro-onnx numpy

      - name: Download the Kokoro model and voice pack
        run: |
          set -euo pipefail
          curl -fL -o kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fL -o voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -lh kokoro-v1.0.onnx voices-v1.0.bin

      - name: Generate narration and timing manifest
        run: |
          python3 scripts/tts_kokoro.py --model kokoro-v1.0.onnx --voices voices-v1.0.bin
          echo "=== manifest ==="
          cat src/manifest.json

      - name: Type-check
        run: npx tsc --noEmit

      - name: Render video with Remotion
        run: |
          npx remotion render src/index.ts BallsAndSticks \
            out/balls-and-sticks.mp4 \
            --gl=swangle --concurrency=3 --log=info

      - name: Stitch the narration into one track and verify the MP4
        run: |
          set -euo pipefail
          ffmpeg -y -hide_banner -loglevel error \
            -f concat -safe 0 -i public/audio/list.txt -c copy out/narration.wav
          echo "=== container ==="
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/balls-and-sticks.mp4
          echo "=== streams ==="
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -of default=nw=1 out/balls-and-sticks.mp4
          echo "=== audio level ==="
          ffmpeg -hide_banner -i out/balls-and-sticks.mp4 -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"
          echo "=== narration ==="
          ffprobe -v error -show_entries format=duration -of default=nw=1 out/narration.wav

      - name: Upload the finished video
        uses: actions/upload-artifact@v4
        with:
          name: balls-and-sticks
          path: |
            out/balls-and-sticks.mp4
            out/narration.wav
            src/manifest.json
          if-no-files-found: error
